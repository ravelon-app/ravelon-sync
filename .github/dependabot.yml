version: 2
updates:
  # One lockfile at the root: npm workspaces resolve server/ and web/ from it.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # A week between publish and proposal filters out the packages that get
    # pulled after someone notices they were compromised.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    ignore:
      # Majors land by hand. An unattended major on Fastify or better-sqlite3
      # is not something to review at the same depth as a patch bump.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      github-actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Keeps the node base image in the Dockerfile current.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # The postgres image in compose.postgres.yaml. Majors stay manual here too:
  # a new PostgreSQL major needs a dump and restore, not just a new tag.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
