name: Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Image name
        id: image
        run: |
          repo="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "name=${{ env.REGISTRY }}/${repo}" >> "$GITHUB_OUTPUT"

      # Reported by /v1/health and the admin interface. A release reports its
      # tag; anything else the package version plus the commit it came from.
      - name: Version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(jq -r .version package.json)+sha.${GITHUB_SHA::7}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=Ravelon Sync
            org.opencontainers.image.description=Self-hosted, zero-knowledge sync server for Ravelon clients
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A pull request builds and is smoke-tested locally, without publishing.
      - name: Build for verification
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: ravelon-sync:pr
          build-args: |
            RAVELON_SYNC_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=sync
          cache-to: type=gha,mode=max,scope=sync

      - name: Build and push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            RAVELON_SYNC_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=sync
          cache-to: type=gha,mode=max,scope=sync
          # Self-hosters pull this with `docker compose pull`, and an
          # attestation index breaks that on older Docker engines. A plain
          # manifest is worth more here than the attestations are.
          provenance: false
          sbom: false

      - name: Verify the image runs
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            image="ravelon-sync:pr"
          else
            image="$(echo '${{ steps.meta.outputs.tags }}' | head -1)"
          fi

          docker run -d --name ravelon-sync-ci -p 4198:4100 \
            -e SYNC_JWT_SECRET="$(openssl rand -base64 48)" \
            -e MFA_ENCRYPTION_KEY="$(openssl rand -base64 48)" \
            -e SETTINGS_ENCRYPTION_KEY="$(openssl rand -base64 48)" \
            -e PUBLIC_URL=http://127.0.0.1:4198 \
            "$image"

          for attempt in $(seq 1 30); do
            sleep 1
            curl -fsS http://127.0.0.1:4198/healthz >/dev/null 2>&1 && break
          done

          # The runtime stage copies a dependency tree npm workspaces hoists to
          # the root. A missing module only shows up when the image actually
          # serves a request, so the check has to go through the API.
          curl -fsS http://127.0.0.1:4198/v1/health | grep -q '"service":"ravelon-sync"'
          curl -fsS http://127.0.0.1:4198/v1/health \
            | grep -qF '"version":"${{ steps.version.outputs.version }}"'
          curl -fsS http://127.0.0.1:4198/v1/public-config | grep -q '"needsSetup":true'
          curl -fsS http://127.0.0.1:4198/ | grep -q '<div id="root">'

          # The container must not be running as root.
          test "$(docker exec ravelon-sync-ci id -u)" != "0"

          # Docker's own health check must reach /healthz, not just exist.
          for attempt in $(seq 1 60); do
            status="$(docker inspect --format '{{.State.Health.Status}}' ravelon-sync-ci)"
            [ "$status" = "starting" ] || break
            sleep 1
          done
          test "$status" = "healthy"

          docker logs ravelon-sync-ci
          docker rm -f ravelon-sync-ci
