# Ravelon Sync backed by PostgreSQL.
#
#   docker compose -f compose.postgres.yaml up -d
#
# Use this when you want replicas, or you already run PostgreSQL and would
# rather back it up with everything else. SQLite (compose.yaml) is the simpler
# choice for a single instance and handles a small team without complaint.

name: ravelon-sync

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ravelon_sync}
      POSTGRES_USER: ${POSTGRES_USER:-ravelon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - backend

  sync:
    image: ghcr.io/ravelon-app/ravelon-sync:latest
    build:
      context: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4100
      HOST: 0.0.0.0
      SYNC_JWT_SECRET: ${SYNC_JWT_SECRET:?Set SYNC_JWT_SECRET in .env}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?Set MFA_ENCRYPTION_KEY in .env}
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:?Set SETTINGS_ENCRYPTION_KEY in .env}
      PUBLIC_URL: ${PUBLIC_URL:?Set PUBLIC_URL in .env}
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-}
      # The password travels separately in PGPASSWORD, which the PostgreSQL
      # client reads when the URL carries none. Interpolated into the URL, a
      # password containing @, :, / or # would break the connection string.
      DATABASE_URL: postgresql://${POSTGRES_USER:-ravelon}@postgres:5432/${POSTGRES_DB:-ravelon_sync}
      PGPASSWORD: ${POSTGRES_PASSWORD}

      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-Ravelon Sync <sync@localhost>}

      # Every other setting .env.example documents. Compose only hands a
      # container what is listed here, so a value missing from this block
      # would be silently ignored.
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # Unset keeps the bundled interface; an empty value means API only.
      WEB_ROOT: ${WEB_ROOT-/app/server/public}
      VAULT_STORAGE_LIMIT_MB: ${VAULT_STORAGE_LIMIT_MB:-256}
      VAULTS_PER_USER: ${VAULTS_PER_USER:-50}
      ACCESS_TOKEN_TTL_SEC: ${ACCESS_TOKEN_TTL_SEC:-900}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-60}
      RATE_LIMIT_DISABLED: ${RATE_LIMIT_DISABLED:-false}
      RATE_LIMIT_AUTH_PER_IP: ${RATE_LIMIT_AUTH_PER_IP:-30}
      RATE_LIMIT_AUTH_FAILURES: ${RATE_LIMIT_AUTH_FAILURES:-10}
      RATE_LIMIT_SYNC_PER_USER: ${RATE_LIMIT_SYNC_PER_USER:-240}
      RATE_LIMIT_API_PER_USER: ${RATE_LIMIT_API_PER_USER:-600}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${BIND_IP:-127.0.0.1}:${PORT:-4100}:4100"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4100/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

volumes:
  postgres_data:

networks:
  backend:
